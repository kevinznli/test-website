<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>California Climate & Hazard Map</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
    }
    .map-frame-container {
      flex: 1;
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>California Regional Wind & Fire Hazard Tracker</h1>
    <span>Source: Open-Meteo & NWS Benchmarks</span>
  </header>

  <div class="map-frame-container">
    <!-- Loads the file produced by graph.py -->
    <iframe src="california_map.html" title="California Map"></iframe>
  </div>
</body>
</html>
